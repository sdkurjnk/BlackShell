name: Publish to npm

# Fires on the version tag vX.Y.Z that finalize.yml creates -- i.e. BEFORE the
# release/hotfix PRs merge. Builds + tests the native engine on every platform,
# bundles the binary plus the LLVM/clang shared libs it links against under
# vendor/<platform>-<arch>/, and publishes @sdkurjnk/blackshell to npm. The
# launcher (dist/cli.js) picks the matching vendor/ binary at runtime; a local dev
# build in build/ is the fallback (see src/launcher/cli.ts).
#
# Publish-before-merge: merge-release.yml holds the ->master/->develop merge until
# THIS run succeeds, so a broken build on any platform (or a failed npm publish)
# blocks the merge instead of surfacing only after the release is tagged.
#
# Version comes from the tag vX.Y.Z (written into package.json at publish time),
# so no version-bump commit is needed in the release branch.
#
# Auth: an npm granular automation token in the NPM_TOKEN secret. `id-token: write`
# is kept so npm attaches build provenance (publishConfig.provenance = true).
#
# Self-contained (#15): the engine embeds Clang/LLVM in-process (no clang/llc on
# the user's PATH). Stock LLVM packages are LLVM_LINK_LLVM_DYLIB=ON on every
# platform, so the engine links libLLVM/libclang-cpp dynamically; we bundle those
# shared libs beside the binary and the engine finds them via rpath ($ORIGIN /
# @loader_path; sibling DLLs on Windows). workflow_dispatch builds without
# publishing, to validate the matrix before cutting a release.
on:
  push:
    tags: ['v*']
  workflow_dispatch:

jobs:
  # One native engine per platform. vendor = `${process.platform}-${process.arch}`
  # so the launcher resolves vendor/<vendor>/blackshell-engine[.exe] directly.
  build-engine:
    name: Build engine (${{ matrix.vendor }})
    runs-on: ${{ matrix.os }}
    strategy:
      # Collect every platform's errors in one run (release builds are rare).
      fail-fast: false
      matrix:
        include:
          - { os: ubuntu-latest,    vendor: linux-x64,    ext: "" }
          - { os: ubuntu-24.04-arm, vendor: linux-arm64,  ext: "" }
          - { os: macos-15-intel,   vendor: darwin-x64,   ext: "" }
          - { os: macos-latest,     vendor: darwin-arm64, ext: "" }
          - { os: windows-latest,   vendor: win32-x64,    ext: ".exe" }
    steps:
      - uses: actions/checkout@v4

      # scripts/build-engine.mjs statically links LLVM/Clang into one binary, so
      # each block just installs the toolchain, builds+tests, and copies the single
      # exe — no shared libs to bundle (self-contained; see the script header).

      # --- Linux: apt.llvm.org LLVM 23 (same pin as test.yml) ---
      - name: Build + test (Linux)
        if: runner.os == 'Linux'
        shell: bash
        run: |
          set -euo pipefail
          wget -O /tmp/llvm.sh https://apt.llvm.org/llvm.sh
          chmod +x /tmp/llvm.sh
          sudo /tmp/llvm.sh 23
          sudo apt-get install -y llvm-23-dev libclang-23-dev clang-23
          node scripts/build-engine.mjs --test
          # Gate the merge on the engine actually working on this platform.
          ./build/blackshell-engine-test src/engine/examples/add2.c
          out="vendor/${{ matrix.vendor }}"
          mkdir -p "$out"
          cp build/blackshell-engine "$out/"
          ls -l "$out"

      # --- macOS: Homebrew LLVM ---
      - name: Build + test (macOS)
        if: runner.os == 'macOS'
        shell: bash
        run: |
          set -euo pipefail
          brew install llvm
          node scripts/build-engine.mjs --test
          ./build/blackshell-engine-test src/engine/examples/add2.c
          out="vendor/${{ matrix.vendor }}"
          mkdir -p "$out"
          cp build/blackshell-engine "$out/"
          ls -l "$out"

      # --- Windows: MSYS2 UCRT64 toolchain, driven from pwsh so Windows node runs
      #     the build script while g++/llvm-config resolve from the UCRT64 bin. ---
      - name: Setup MSYS2 (Windows)
        if: runner.os == 'Windows'
        uses: msys2/setup-msys2@v2
        with:
          msystem: UCRT64
          update: true
          install: >-
            mingw-w64-ucrt-x86_64-gcc
            mingw-w64-ucrt-x86_64-llvm
            mingw-w64-ucrt-x86_64-clang

      - name: Build + test (Windows)
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          $env:Path = "$env:RUNNER_TEMP\msys64\ucrt64\bin;$env:Path"
          node scripts/build-engine.mjs --test
          if ($LASTEXITCODE) { exit 1 }
          & build/blackshell-engine-test.exe src/engine/examples/add2.c
          if ($LASTEXITCODE) { exit 1 }
          $out = "vendor/${{ matrix.vendor }}"
          New-Item -ItemType Directory -Force -Path $out | Out-Null
          Copy-Item build/blackshell-engine.exe "$out/"
          Get-ChildItem $out

      - uses: actions/upload-artifact@v4
        with:
          name: engine-${{ matrix.vendor }}
          path: vendor/${{ matrix.vendor }}
          if-no-files-found: error

  publish:
    name: Publish to npm
    needs: build-engine
    # Publish only on the version tag; workflow_dispatch is a build-only dry run.
    if: github.event_name == 'push'
    runs-on: ubuntu-latest
    permissions:
      contents: read
      id-token: write        # provenance attestation
    steps:
      - uses: actions/checkout@v4

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: '22'
          registry-url: 'https://registry.npmjs.org'

      - name: Download engine binaries
        uses: actions/download-artifact@v4
        with:
          pattern: engine-*
          path: vendor-artifacts

      - name: Assemble vendor/ tree
        run: |
          set -e
          for d in vendor-artifacts/engine-*; do
            name="${d##*/engine-}"
            mkdir -p "vendor/$name"
            cp "$d"/* "vendor/$name/"
          done
          # upload-artifact drops file modes; restore exec bit on the unix binaries.
          chmod +x vendor/linux-*/blackshell-engine vendor/darwin-*/blackshell-engine
          ls -lR vendor

      - name: Install dependencies
        run: npm ci

      - name: Build launcher (dist/)
        run: npm run build:ts

      - name: Set package version from the release tag
        run: npm version "${GITHUB_REF_NAME#v}" --no-git-tag-version --allow-same-version

      - name: Publish
        run: npm publish
        env:
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}
