name: Publish to npm

# Fires on the version tag vX.Y.Z that finalize.yml creates -- i.e. BEFORE the
# release/hotfix PRs merge. Builds + tests the native engine on every platform,
# bundles the binary plus the LLVM/clang shared libs it links against under
# vendor/<platform>-<arch>/, and publishes @sdkurjnk/blackshell to npm. The
# launcher (dist/cli.js) picks the matching vendor/ binary at runtime; a local dev
# build in build/ is the fallback (see src/launcher/cli.ts).
#
# Publish-before-merge: merge-release.yml holds the ->master/->develop merge until
# THIS run succeeds, so a broken build on any platform (or a failed npm publish)
# blocks the merge instead of surfacing only after the release is tagged.
#
# Version comes from the tag vX.Y.Z (written into package.json at publish time),
# so no version-bump commit is needed in the release branch.
#
# Auth: an npm granular automation token in the NPM_TOKEN secret. `id-token: write`
# is kept so npm attaches build provenance (publishConfig.provenance = true).
#
# Self-contained: scripts/build-engine.mjs statically links Clang/LLVM into one
# binary (no libLLVM/libclang at runtime, no clang/llc on the user's PATH). The
# 5-platform build is the reusable build-engine.yml, shared with test.yml so CI and
# CD build identically. workflow_dispatch builds without publishing, to validate
# the matrix before cutting a release.
on:
  push:
    tags: ['v*']
  workflow_dispatch:

jobs:
  build-engine:
    uses: ./.github/workflows/build-engine.yml

  publish:
    name: Publish to npm
    needs: build-engine
    # Publish only on the version tag; workflow_dispatch is a build-only dry run.
    if: github.event_name == 'push'
    runs-on: ubuntu-latest
    permissions:
      contents: read
      id-token: write        # provenance attestation
    steps:
      - uses: actions/checkout@v4

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: '22'
          registry-url: 'https://registry.npmjs.org'

      - name: Download engine binaries
        uses: actions/download-artifact@v4
        with:
          pattern: engine-*
          path: vendor-artifacts

      - name: Assemble vendor/ tree
        run: |
          set -e
          for d in vendor-artifacts/engine-*; do
            name="${d##*/engine-}"
            mkdir -p "vendor/$name"
            cp "$d"/* "vendor/$name/"
          done
          # upload-artifact drops file modes; restore exec bit on the unix binaries.
          chmod +x vendor/linux-*/blackshell-engine vendor/darwin-*/blackshell-engine
          ls -lR vendor

      - name: Install dependencies
        run: npm ci

      - name: Build launcher (dist/)
        run: npm run build:ts

      - name: Set package version from the release tag
        run: npm version "${GITHUB_REF_NAME#v}" --no-git-tag-version --allow-same-version

      - name: Publish
        run: npm publish
        env:
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}
