name: Publish to npm

# Fires when post-merge.yml creates the GitHub Release (release: published).
# Publishes @sdkurjnk/blackshell to npm. The published version is taken from the
# release tag vX.Y.Z (written into package.json at publish time), so no version-bump
# commit is needed in the release branch.
#
# Auth: an npm granular automation token in the NPM_TOKEN secret. `id-token: write`
# is kept so npm attaches build provenance (publishConfig.provenance = true).
on:
  release:
    types: [published]

jobs:
  publish:
    name: Publish to npm
    runs-on: ubuntu-latest
    permissions:
      contents: read
      id-token: write        # provenance attestation
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: '22'
          registry-url: 'https://registry.npmjs.org'

      - name: Install dependencies
        run: npm ci

      - name: Set package version from the release tag
        run: npm version "${GITHUB_REF_NAME#v}" --no-git-tag-version --allow-same-version

      - name: Publish
        run: npm publish
        env:
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}
